name: Deploy site and release app

# The site deploys on every merge. The app releases at most once a day, because
# installed copies have to restart to update: each merge reuses the published
# app, and the daily run releases a new version only if the app has changed.
on:
  push:
    branches: [main]
  # 10:00 UTC, early morning in California. GitHub can start scheduled runs late.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      release_app:
        description: Release a new app version now, instead of waiting for the daily release
        type: boolean
        default: false

permissions:
  contents: read

# Finish an active deployment before starting the next one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decide whether to release the app
        id: plan
        env:
          RELEASE_APP: ${{ inputs.release_app }}
        run: |
          args=()
          if [ "$RELEASE_APP" = true ]; then args=(--release-app); fi
          node scripts/plan-release.mjs "$GITHUB_EVENT_NAME" "${args[@]}"

  build-app:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # Build with the macOS 26 SDK. SwiftUI keeps older behavior, like popovers
    # that don't resize to fit, in apps built with older SDKs.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This commit gets its own version, recorded in dist/release.json.
      - name: Set the release version
        run: node scripts/set-release-version.mjs

      # Release signing turns on once every signing secret exists. Until then, build ad-hoc.
      - name: Choose signing mode
        id: mode
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID \
                      NOTARY_API_ISSUER_ID SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq 7 ]; then
            echo "::notice::No signing secrets configured. Building an ad-hoc signed app without updates."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release signing is partly configured. Missing: ${missing[*]}. See WhatThePort/UPDATES.md."
            exit 1
          fi

      - name: Build the ad-hoc signed Mac app
        if: steps.mode.outputs.mode == 'adhoc'
        run: |
          ./WhatThePort/build-app.sh
          codesign --verify --strict WhatThePort/.build/WhatThePort.app
          ./WhatThePort/make-dmg.sh
          mkdir -p dist
          cp WhatThePort/.build/WhatThePort.dmg dist/WhatThePort.dmg

      - name: Install signing credentials
        if: steps.mode.outputs.mode == 'release'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12 does not contain a Developer ID Application certificate and private key."
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          (umask 077
           printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
           printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key")

      - name: Build, notarize and sign the update
        if: steps.mode.outputs.mode == 'release'
        env:
          SPARKLE_FEED_URL: https://whattheport.dev/updates/appcast.xml
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-key
          NOTARY_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw WhatThePort/Info.plist)"
          build="$(plutil -extract CFBundleVersion raw WhatThePort/Info.plist)"
          ./WhatThePort/release.sh "$version" "$build"
          mkdir -p dist
          cp WhatThePort/.build/WhatThePort.dmg dist/WhatThePort.dmg
          ditto WhatThePort/.build/updates dist/updates

      - name: Remove signing credentials
        if: always() && steps.mode.outputs.mode == 'release'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-key"

      - name: Verify the download
        run: |
          hdiutil verify dist/WhatThePort.dmg
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/WhatThePort.dmg
          codesign --verify --strict "$mount/WhatThePort.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [plan, build-app]
    # Runs after a new app is built, or without one when the site reuses the published app.
    if: >-
      !cancelled() && needs.plan.outputs.deploy == 'true' &&
      (needs.build-app.result == 'success' || needs.build-app.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before deploying. See README.md."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Signed builds also bring public/updates/ with the Sparkle feed and archive.
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.release == 'true'
        with:
          name: mac-app
          path: public

      # Copy the live download, feed and archive byte for byte, so their signatures still hold.
      - name: Carry over the published app
        if: needs.plan.outputs.release != 'true'
        env:
          SITE: https://whattheport.dev
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; }
          fetch "$SITE/WhatThePort.dmg" public/WhatThePort.dmg
          # Ad-hoc releases have no feed. Any other failure stops the deploy rather than drop it.
          mkdir -p public/updates
          status="$(curl -sSL --retry 3 -o public/updates/appcast.xml -w '%{http_code}' "$SITE/updates/appcast.xml")"
          if [ "$status" = 200 ]; then
            archive="$(grep -o '<enclosure[^>]* url="[^"]*"' public/updates/appcast.xml | head -1 | sed 's/.* url="\([^"]*\)"/\1/')"
            case "$archive" in
              "$SITE"/updates/*.zip) fetch "$archive" "public/updates/${archive##*/}" ;;
              *) echo "::error::The published feed's archive isn't on $SITE: $archive"; exit 1 ;;
            esac
          elif [ "$status" = 404 ]; then
            rm -r public/updates
          else
            echo "::error::Couldn't read the published feed (HTTP $status)."
            exit 1
          fi
          printf '{\n  "version": "%s",\n  "build": "%s",\n  "commit": "%s"\n}\n' \
            "$VERSION" "$BUILD" "$COMMIT" > public/release.json
          ls -R public/updates public/release.json 2>/dev/null || true

      # The released app's version, for the checks below and the site's structured data.
      - name: Set the app version
        run: node scripts/set-release-version.mjs --published public/release.json

      - name: Verify the download
        run: VERCEL_ENV=production node scripts/check-download.mjs

      - name: Install dependencies and Vercel CLI
        run: |
          npm ci
          npm install --global vercel@59.6.2

      - name: Pull production configuration
        run: vercel pull --yes --environment=production

      - name: Build the site
        run: vercel build --prod

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes
